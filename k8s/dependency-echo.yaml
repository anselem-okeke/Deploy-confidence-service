apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-echo
  namespace: deploy-confidence-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dependency-echo
  template:
    metadata:
      labels:
        app: dependency-echo
    spec:
      containers:
        - name: dependency-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:8080"
            - "-text=ok"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-echo
  namespace: deploy-confidence-tests
spec:
  selector:
    app: dependency-echo
  ports:
    - name: http
      port: 80
      targetPort: 8080