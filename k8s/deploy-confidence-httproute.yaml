apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deploy-confidence-route
  namespace: deploy-confidence
spec:
  parentRefs:
    - name: deploy-confidence-gateway
  hostnames:
    - deploy-confidence.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: deploy-confidence-service
          port: 8000
